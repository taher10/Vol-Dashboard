# Render blueprint for the public demo backend (DEMO_MODE=1).
#
# Deploy: Render dashboard -> New -> Blueprint -> point at this repo.
#
# The three things that make this safe, in order of importance:
#
#   1. No credentials. There is no SCHWAB_API_KEY, SCHWAB_APP_SECRET,
#      SCHWAB_TOKEN_B64 or ANTHROPIC_API_KEY below, and none should ever be
#      added. Everything else here is defence in depth; this is the actual
#      protection.
#   2. requirements-demo.txt omits schwab-py and anthropic, so the machine
#      cannot reach either service even if a route were exposed by mistake.
#   3. DEMO_MODE=1 removes POST /api/refresh and POST /api/chat.
#
# The database
# ------------
# The demo serves a frozen snapshot built by `python -m src.build_demo_db`.
# It is NOT in the repo: the live chain store is a set of release assets
# (tag `chain-latest`, see src/chain_release.py), and pulling it on every
# deploy would be slow and pointless when the demo only needs ten days of a
# simulated market.
#
# .github/workflows/publish-demo.yml republishes it weekly to a release with
# the FIXED tag `demo-latest`, so these URLs never change and DEMO_DB_URL is
# set once:
#
#   https://github.com/taher10/Vol-Dashboard/releases/download/demo-latest/schwab_database.db
#
# Since 2026-11-22 the chain store is a small index file plus one compressed
# partition per calendar month -- see src/schwab_database.py for why. So the
# build fetches three things rather than two: that index file (DEMO_DB_URL),
# a manifest naming the partitions, and each partition. Every one of them is
# a plain release URL derived from DEMO_DB_URL, so there is still exactly one
# value to configure.
#
# Deliberately NOT asking the GitHub API which assets exist, even though
# src/chain_release.py can: this box would be calling api.github.com
# unauthenticated, at 60 requests an hour per IP, on an address it shares
# with every other free instance. A deploy that fails on a stranger's rate
# limit is worse than a manifest file.
#
# See DEPLOYING.md.

services:
  - type: web
    name: vol-dashboard-demo-api
    runtime: python
    plan: free
    region: oregon
    branch: main

    buildCommand: |
      pip install -r requirements-demo.txt
      # Fetch the trimmed demo database. Fail loudly rather than deploying an
      # API with no data behind it -- a 500 on every page is harder to
      # diagnose after the fact than a failed build.
      if [ -z "$DEMO_DB_URL" ]; then
        echo "DEMO_DB_URL is not set. Build one with 'python -m src.build_synthetic_db',"
        echo "upload it as a GitHub Release asset, and set DEMO_DB_URL to that URL."
        exit 1
      fi
      mkdir -p demo-data/schwab_database_chains
      curl -fsSL "$DEMO_DB_URL" -o demo-data/schwab_database.db
      # The partitions holding the actual chains. Their names come from a
      # manifest published beside them, and their URLs from DEMO_DB_URL's
      # own directory, so adding a month upstream needs no change here.
      DEMO_BASE_URL="${DEMO_DB_URL%/*}"
      curl -fsSL "$DEMO_BASE_URL/chains-manifest.txt" -o demo-data/chains-manifest.txt
      while read -r ASSET; do
        [ -n "$ASSET" ] || continue
        curl -fsSL "$DEMO_BASE_URL/$ASSET" -o "demo-data/schwab_database_chains/${ASSET#chains-}"
      done < demo-data/chains-manifest.txt
      # Decode a chain rather than counting rows. The index can be perfectly
      # readable while a partition is missing or truncated, and that failure
      # would show up as an empty surface on the deployed site instead of
      # here.
      SCHWAB_DB_PATH=demo-data/schwab_database.db python -c "
      import sys
      from src.schwab_database import SchwabDatabase
      db = SchwabDatabase()
      coverage = db.snapshot_symbol_counts(limit=1)
      if not coverage:
          sys.exit('demo database: no sessions')
      day, symbols = coverage[0]
      contracts = len(db.options_snapshot('SPX', day))
      print(f'demo database: {symbols} symbols on {day}, {contracts:,} SPX contracts, {len(db.partition_paths())} partition(s)')
      sys.exit(0 if contracts else 'the newest SPX chain decoded to nothing')
      "
      # The metric history is a separate database and is equally required.
      # IV rank, IV percentile and the richness columns are all computed
      # from it, and the copy committed to the repository holds real
      # history derived from Schwab data -- so fetching only the chain
      # would leave the demo serving a simulated surface scored against
      # real numbers. Published to the same fixed tag, so the URL is
      # stable and has a default here rather than needing a dashboard edit.
      curl -fsSL "${DEMO_HISTORY_URL:-https://github.com/taher10/Vol-Dashboard/releases/download/demo-latest/vol_history.db}" -o demo-data/vol_history.db
      python -c "import sqlite3,sys; n=sqlite3.connect('demo-data/vol_history.db').execute('select count(*) from metric_history').fetchone()[0]; print(f'demo history: {n:,} rows'); sys.exit(0 if n else 1)"

    startCommand: uvicorn src.api.main:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /api/health

    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
      - key: DEMO_MODE
        value: "1"
      # Fills the row caches in a background thread at startup. The free
      # instance sleeps after 15 minutes, so every visit after a quiet spell
      # starts a fresh process with empty caches -- ~18s for the first Vol
      # Scanner request on this CPU. Render already spends ~50s waking the
      # container; warming alongside that costs the visitor nothing and
      # finishes first. Off everywhere else: see src/api/warmup.py.
      - key: WARM_CACHE
        value: "1"
      # The Vercel domain serving the frontend. CORS only constrains
      # browsers -- it is not what keeps this deployment safe (see above) --
      # but leaving it open would let any page script-read the API through a
      # visitor, for no benefit.
      - key: FRONTEND_ORIGIN
        sync: false
      # Points data_loader at the downloaded snapshot instead of the
      # repo path, which does not exist on this box.
      - key: SCHWAB_DB_PATH
        value: demo-data/schwab_database.db
      # Keeps HistoryStore off the real history committed in the repo.
      - key: VOL_HISTORY_DB_PATH
        value: demo-data/vol_history.db
      # Set in the Render dashboard, not here.
      - key: DEMO_DB_URL
        sync: false
      # Optional. The build defaults to the fixed `demo-latest` asset, so
      # this only needs setting to point somewhere else.
      - key: DEMO_HISTORY_URL
        sync: false
