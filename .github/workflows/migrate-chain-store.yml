name: Migrate the chain store to monthly partitions

# ONE-OFF. Run it once from the Actions tab, confirm the output, then delete
# this file. It converts the archived single-table chain database into the
# compressed monthly partitions src/schwab_database.py now reads, and
# publishes them to the chain-latest release.
#
# Where the input comes from
# --------------------------
# Git LFS, at the last commit that still tracked the file. The original plan
# was to seed a 658MB `schwab_database.db` asset first and migrate from that,
# but the three partition pull requests were merged before the seed workflow
# was ever dispatched -- and the second of them deleted that workflow. So no
# chain-latest release exists, and git history is now the only copy.
#
# That turns out to be the better arrangement: the 658MB file never has to
# become a release asset at all. It goes straight from LFS to ~52MB of
# partitions, and the intermediate upload that would have cost a third of the
# per-asset ceiling simply does not happen.
#
# LFS_SOURCE is pinned to a commit, not a branch. It is the parent of the
# commit that untracked the file, and the pointer there is
# oid sha256:a7a6fc51...36e8, size 658022400 -- verified byte-for-byte
# against the working copy before that copy was retired.
#
# Why this runs here and not on a laptop
# --------------------------------------
# GitHub's own network carries both legs -- the LFS download in and the asset
# uploads out -- and `gh` is authenticated here by github.token with no
# credential to create. The download spends LFS *bandwidth*, which is
# separate from the storage quota this whole change exists to stop growing.
#
# Why it is manual
# ----------------
# The source is the only copy of four months of option chains -- Schwab
# serves current chains only, so a day lost here is lost permanently. A
# migration that ran on a schedule, or on push, would run at a time nobody
# chose and with nobody reading the output. This one is dispatched by a
# person who then looks at the numbers.
#
# What it does NOT do
# -------------------
# It does not delete or overwrite anything that exists today, because
# nothing does: chain-latest has no assets until this job creates them. And
# it cannot damage its own source -- src/migrate_to_partitions.py opens the
# legacy file `mode=ro` and never writes to it. The rollback is the LFS
# object at LFS_SOURCE, which stays in history permanently whatever this
# job does.
#
# Ordering
# --------
# Until this runs, daily-snapshot.yml fails at its `Fetch the chain store`
# step -- sync() refuses a release it cannot list rather than starting from
# an empty database ("Refusing to guess what to download"). That costs a
# night's collection if it fires first, but it cannot publish a one-day
# index over a four-month one. Running this fixes it.

on:
  workflow_dispatch: {}

# A second run racing the first would have both uploading to the same tag,
# and the loser leaves the release holding a partition from one migration and
# an index from another. publish-demo.yml carries a concurrency group for the
# same reason.
concurrency:
  group: chain-store-migration
  cancel-in-progress: false

permissions:
  contents: write

env:
  # Parent of 95a3d2c, the commit that untracked database/schwab_database.db.
  LFS_SOURCE: 518c35387f490126f6cdbec6e626a191c8a2c376
  TAG: chain-latest

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      # The code to migrate with: current main, where the chain database is
      # untracked, so this checkout pulls no LFS object.
      - uses: actions/checkout@v4

      # The data to migrate: a second checkout pinned to the commit that
      # still tracked the file. .gitattributes exists at that commit and
      # tracks this path, so `lfs: true` smudges the real 658MB file rather
      # than leaving a 130-byte pointer. Doing it as a checkout avoids
      # hand-rolled `git lfs pull` plumbing, which would have to contend
      # with .gitattributes being absent at main.
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.LFS_SOURCE }}
          lfs: true
          path: legacy-src

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # A pointer file is ~130 bytes and SQLite would reject it, but the
      # error would come from deep inside the migration. Checking the size
      # and the row count here says plainly which of the two went wrong.
      - name: Check the legacy database is the archive
        run: |
          set -euo pipefail
          LEGACY=legacy-src/database/schwab_database.db
          ls -l "$LEGACY"
          if [ "$(wc -c < "$LEGACY")" -lt 100000000 ]; then
            echo "::error::$LEGACY is too small to be the archive -- LFS smudge probably did not run."
            exit 1
          fi
          python - <<'PY'
          import sqlite3
          c = sqlite3.connect("file:legacy-src/database/schwab_database.db?mode=ro", uri=True)
          rows = c.execute("SELECT COUNT(*) FROM options").fetchone()[0]
          chains = c.execute("SELECT COUNT(*) FROM (SELECT DISTINCT symbol, snapshot_date FROM options)").fetchone()[0]
          span = c.execute("SELECT MIN(snapshot_date), MAX(snapshot_date) FROM options").fetchone()
          prices = c.execute("SELECT COUNT(*) FROM stock_prices").fetchone()[0]
          print(f"{rows:,} contract rows, {chains:,} chains, {span[0]} -> {span[1]}, {prices:,} price rows")
          if rows < 1_000_000:
              raise SystemExit(f"Only {rows:,} rows -- that is not the archive. Stopping.")
          PY

      # The migration writes the partitions beside a NEW index file and never
      # opens the source for writing, then re-reads every chain and compares
      # it against the query it replaces -- row for row, dtype for dtype,
      # with pandas.testing.assert_frame_equal(check_exact=True). A single
      # mismatch exits non-zero and nothing is published.
      #
      # Exactness rather than closeness because this is the only copy: a
      # JSON round-trip returns 0.30000000000000004 for a stored 0.3, and
      # "near enough" is not a property you can restore later.
      #
      # database/ is gitignored and so is not in the checkout; sqlite3 will
      # not create a missing parent directory.
      - name: Migrate and verify every chain
        run: |
          set -euo pipefail
          mkdir -p database
          python -m src.migrate_to_partitions \
            --source legacy-src/database/schwab_database.db \
            --destination database/schwab_database.db

      # Published only after the verification above exited 0. The index file
      # goes last: until it is there, sync() refuses the release outright, so
      # a reader that arrives mid-upload backs off instead of accepting a
      # partial store. The reverse order would leave a window where the index
      # promises months whose partitions have not arrived.
      - name: Publish the partitions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m src.chain_release check --min-chains 1000

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Creating the $TAG release."
            gh release create "$TAG" \
              --title "Chain store (latest)" \
              --notes "Compressed monthly partitions of the option-chain archive, republished by daily-snapshot.yml. Not a source release."
          fi

          # Skipped by name, not by position. `publishable` happens to list
          # the index first, so `tail -n +2` would work today -- and would
          # silently drop a partition instead the day that ordering changes.
          INDEX_ASSET=$(python -c 'from src.chain_release import INDEX_ASSET; print(INDEX_ASSET)')

          python -m src.chain_release publishable \
            | while IFS=$'\t' read -r STORE_FILE ASSET; do
            if [ "$ASSET" = "$INDEX_ASSET" ]; then
              continue
            fi
            echo "uploading $STORE_FILE as $ASSET"
            cp "$STORE_FILE" "$RUNNER_TEMP/$ASSET"
            gh release upload "$TAG" "$RUNNER_TEMP/$ASSET" --clobber
          done

          gh release upload "$TAG" database/schwab_database.db --clobber
          echo
          echo "Published. Assets now on $TAG:"
          gh release view "$TAG" --json assets \
            --jq '.assets[] | "  \(.name)  \(.size) bytes"'

      # Proves the published set is usable from outside, by fetching it the
      # way every reader will and reading a chain back out. A migration that
      # verified locally and published something unreadable would be the
      # worst outcome of all, because it would look like a success.
      - name: Fetch what was just published and read it
        run: |
          set -euo pipefail
          rm -rf roundtrip && mkdir -p roundtrip
          SCHWAB_DB_PATH=roundtrip/schwab_database.db python -m src.chain_release sync
          SCHWAB_DB_PATH=roundtrip/schwab_database.db python - <<'PY'
          from src.schwab_database import SchwabDatabase
          db = SchwabDatabase()
          counts = db.snapshot_symbol_counts(limit=3)
          print("most recent sessions:", counts)
          newest_day, _ = counts[0]
          for symbol in ("SPX", "AAPL"):
              chain = db.options_snapshot(symbol, newest_day)
              print(f"  {symbol} {newest_day}: {len(chain):,} contracts")
          dates = db.options_snapshot_dates("SPX")
          print(f"SPX has {len(dates)} sessions, {dates[0]} -> {dates[-1]}")
          if len(dates) < 30:
              raise SystemExit("Fewer SPX sessions than expected -- do not delete anything.")
          PY
          echo
          echo "Round-trip clean. Delete .github/workflows/migrate-chain-store.yml now."
