name: Daily vol snapshot

# Fetches every symbol in src/symbols.py's SYMBOL_REGISTRY and appends the
# computed metrics to history/vol_history.db, then commits that file so
# history survives between runs. This is what makes IV Rank, trailing
# z-scores, and the day-over-day digest possible -- see
# src/history_store.py's docstring for why a committed SQLite file rather
# than a hosted database.
#
# Also commits database/schwab_database.db -- the raw per-contract options
# chain and daily close prices (see src/schwab_database.py), populated as a
# side effect of the same OptionsVolJob.run() call this workflow already
# makes. This table is much larger than vol_history.db's compact per-expiry
# metrics (roughly 1,000+ rows/symbol/day vs. ~16) and was growing ~13-14MB/
# day -- it crossed GitHub's 100MB per-file push limit around 2026-08-14 and
# started silently failing at the final "Commit history" step (fetch/token
# steps still succeeded, so this was easy to miss). Tracked via Git LFS
# (.gitattributes) since 2026-08-20 to fix that; see actions/checkout's
# `lfs: true` below.
#
# LFS IS THE NEAR-TERM CONSTRAINT -- earlier versions of this comment said
# twice that it wasn't, and were wrong both times. The figures, so the next
# reader can see the trend rather than one snapshot:
#   2026-08-20  assumed 1GB/month, "~10 weeks of runway"  (wrong: it is 10GB
#               of STORAGE, not a monthly bandwidth tier)
#   2026-10-15  10GB included, 1.8GB used, 0GB metered    (read as comfort)
#   2026-11-19  10GB included, 9.01GB used (90%)          (one run of room)
#
# What the two optimistic readings both missed: LFS cannot delta-compress a
# SQLite file, so every push stores a COMPLETE NEW COPY. At 628MB/copy and 58
# commits touching this file, the quota went to 9GB without the daily growth
# rate ever changing. Storage is a stock, not a flow -- it does not reset on
# the 1st, and deleting branches or rewriting history does not reclaim it.
#
# A $0 Git LFS budget means overage is refused rather than billed, so the
# failure mode at 10GB is `git push` being REJECTED in "Commit history"
# below -- data collected, then unsavable. The real fix is to stop committing
# this file and publish it as a release asset instead (release storage is not
# metered against the LFS quota, and old assets can actually be deleted).
# Until that lands, assume every run is the one that hits the wall.
# Check github.com/settings/billing/summary before acting on any figure here.
# A live pull
# with no usable quotes (outside market hours) raises LiveDataUnavailableError
# and neither file gets touched that day -- see src/data_quality.py.
#
# Requires these repo secrets (Settings -> Secrets and variables -> Actions),
# same values as the Streamlit Cloud secrets -- see README.md:
#   SCHWAB_API_KEY, SCHWAB_APP_SECRET, SCHWAB_CALLBACK_URL, SCHWAB_TOKEN_B64
#
# Two more secrets fix the "refresh token dies after ~7 days" problem and add
# failure alerts -- both optional but strongly recommended (see README.md):
#   SECRETS_PAT        A GitHub PAT with permission to manage this repo's
#                       Actions secrets (classic 'repo' scope, or fine-grained
#                       with 'Secrets: write'). Lets src/token_sync.py push
#                       the freshly-refreshed token.json back to
#                       SCHWAB_TOKEN_B64 after every run, so the daily cron
#                       itself keeps the refresh token alive indefinitely --
#                       no more manual re-auth every week.
#   NOTIFY_WEBHOOK_URL  A Slack or Discord incoming-webhook URL. If a symbol
#                       fails (not just the expected "no live quotes" skip),
#                       src/notify.py posts a one-line alert there.

on:
  schedule:
    # 21:30 UTC, Mon-Fri -- after the US market close (20:00-21:00 UTC
    # depending on DST) with a buffer for quotes to settle.
    - cron: "30 21 * * 1-5"
  workflow_dispatch: {} # allows manually triggering a run from the Actions tab

permissions:
  contents: write # needed to commit history/vol_history.db back to the repo
  issues: write # needed by "Open an issue on failure" below

jobs:
  snapshot:
    # Pinned rather than ubuntu-latest. That label migrates to Ubuntu 26 on
    # 2026-10-19, and this job collects market data that cannot be refetched:
    # Schwab serves current chains only, so a session missed to a surprise
    # image change is a permanent hole in the history, not a rerun away. The
    # tests workflow deliberately stays on ubuntu-latest so the new image is
    # still exercised somewhere -- it just fails somewhere harmless first.
    runs-on: ubuntu-24.04
    steps:
      # lfs: true installs the LFS filters/hooks this checkout needs both to
      # pull the existing LFS-tracked database/schwab_database.db and to
      # push new versions of it correctly in the "Commit history" step below.
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore token.json from secret
        env:
          SCHWAB_TOKEN_B64: ${{ secrets.SCHWAB_TOKEN_B64 }}
        run: |
          python -c "
          import os
          from src.auth import write_token_from_base64
          write_token_from_base64(os.environ['SCHWAB_TOKEN_B64'])
          "

      - name: Run daily snapshot
        env:
          SCHWAB_API_KEY: ${{ secrets.SCHWAB_API_KEY }}
          SCHWAB_APP_SECRET: ${{ secrets.SCHWAB_APP_SECRET }}
          SCHWAB_CALLBACK_URL: ${{ secrets.SCHWAB_CALLBACK_URL }}
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
        run: python -m src.daily_snapshot

      # if: always() and placed directly after collection, both deliberately.
      #
      # This step used to sit AFTER "Persist refreshed token" with no `if:`,
      # which meant a token-sync failure skipped it -- the day's chains were
      # collected into the runner's disk and then thrown away when the runner
      # was destroyed. That is what happened on 2026-11-18 and 2026-11-19:
      # twelve consecutive runs died on the token step, and because collection
      # itself had succeeded every time, those sessions were discarded rather
      # than missed. Schwab serves current chains only, so they are gone for
      # good.
      #
      # Nothing downstream of collection can make already-collected data less
      # worth keeping, so nothing downstream of collection gets to block the
      # commit. A partial day is still better than no day -- "Validate what
      # was collected" below exists to flag it, and the `git diff --staged
      # --quiet ||` guard means a run that collected nothing commits nothing.
      - name: Commit history if it changed
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history/vol_history.db database/schwab_database.db
          git diff --staged --quiet || git commit -m "Daily vol snapshot $(date -u +%F)"
          git push

      # Runs HERE rather than in data-validation.yml because this job already
      # fetches LFS (it has to, to write the chain DB) and so has the real
      # ~390MB file on disk. The original reason -- that a second daily fetch
      # would exhaust a 1GB/month bandwidth tier -- turned out to be wrong
      # (2026-10-15: 10GB included, 0GB metered). Keeping it here anyway,
      # because validating the file this job just wrote is the more direct
      # arrangement regardless of cost. Placed after the commit deliberately:
      # a validation failure should flag the problem, never discard the day's
      # data.
      # --run-created-at carries when the run was CREATED, not when it is
      # executing. For a first attempt those are the same moment; for a
      # re-run they are not, and the difference is the whole check.
      #
      # On 2026-10-30 the Thursday collection failed at 01:11 UTC and was
      # re-run at 17:58. By then the live session had moved on, so it
      # collected Friday, reported success, and left a permanent hole where
      # Thursday should be. Schwab serves current quotes only, so a late
      # re-run cannot recover the day it was meant to cover. Nothing said
      # so: GitHub reports the latest attempt's conclusion, so the Actions
      # list showed a green check over a missing day.
      - name: Validate what was collected
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CREATED=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)
          echo "run $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT, created $CREATED"
          python -m src.validate_collection --max-stale-days 3 --run-created-at "$CREATED"

      # Runs even if the steps above failed -- schwab-py may still have
      # refreshed the token in place before a later symbol failed for an
      # unrelated reason, and that refreshed token is still worth keeping.
      # Only truly skips work if SECRETS_PAT isn't configured (see
      # src/token_sync.py).
      #
      # Deliberately LAST. The token on disk is written during collection and
      # nothing after it touches token.json, so this step's position cannot
      # affect which token gets persisted -- but when it ran second it could,
      # and did, stop the commit below it from happening at all. A step that
      # saves a credential for *tomorrow* must never outrank saving the data
      # from *today*, because tomorrow's run can re-auth and today's session
      # cannot be refetched.
      - name: Persist refreshed token back to SCHWAB_TOKEN_B64
        if: always()
        env:
          SECRETS_PAT: ${{ secrets.SECRETS_PAT }}
        run: python -m src.token_sync

      # Replaces a webhook POST guarded by `if [ -n "$NOTIFY_WEBHOOK_URL" ]`.
      # NOTIFY_WEBHOOK_URL was never configured, so that step did nothing and
      # exited 0 -- a green check on a step whose entire job was to raise the
      # alarm. Twelve failed runs went unnoticed behind it.
      #
      # An issue needs no secret: github.token is injected automatically, so
      # this cannot silently deactivate the way the webhook did. GitHub emails
      # the repo owner on a new issue, and the open issue itself is a standing
      # marker that the pipeline is down -- visible without opening the
      # Actions tab.
      #
      # Comments on the existing open issue rather than filing a new one each
      # night, so a week-long outage reads as one thread with seven entries
      # instead of seven issues.
      - name: Open an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Daily snapshot pipeline is failing
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          BODY=$(cat <<EOF
          Run \`$GITHUB_RUN_ID\` (attempt $GITHUB_RUN_ATTEMPT) failed on $(date -u +%F).

          The failing step is named in the run log: $RUN_URL

          **This is time-sensitive.** Schwab serves current chains only, so a
          re-run tomorrow collects tomorrow -- it cannot recover the session
          this run was scheduled for. Every night this stays broken is a
          permanent hole in \`history/vol_history.db\`.

          Check which step failed before assuming the Schwab token is at
          fault; see \`.claude/skills/vol-dashboard-development/references/known-issues.md\`.
          EOF
          )
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"
          fi
