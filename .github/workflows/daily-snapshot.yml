name: Daily vol snapshot

# Fetches every symbol in src/symbols.py's SYMBOL_REGISTRY and appends the
# computed metrics to history/vol_history.db, then commits that file so
# history survives between runs. This is what makes IV Rank, trailing
# z-scores, and the day-over-day digest possible -- see
# src/history_store.py's docstring for why a committed SQLite file rather
# than a hosted database.
#
# Also commits database/schwab_database.db -- the raw per-contract options
# chain and daily close prices (see src/schwab_database.py), populated as a
# side effect of the same OptionsVolJob.run() call this workflow already
# makes. This table is much larger than vol_history.db's compact per-expiry
# metrics (roughly 1,000+ rows/symbol/day vs. ~16), so watch repo size over
# time -- revisit with a retention window or Git LFS if it becomes a
# problem. A live pull with no usable quotes (outside market hours) raises
# LiveDataUnavailableError and neither file gets touched that day -- see
# src/data_quality.py.
#
# Requires these repo secrets (Settings -> Secrets and variables -> Actions),
# same values as the Streamlit Cloud secrets -- see README.md:
#   SCHWAB_API_KEY, SCHWAB_APP_SECRET, SCHWAB_CALLBACK_URL, SCHWAB_TOKEN_B64
#
# Two more secrets fix the "refresh token dies after ~7 days" problem and add
# failure alerts -- both optional but strongly recommended (see README.md):
#   SECRETS_PAT        A GitHub PAT with permission to manage this repo's
#                       Actions secrets (classic 'repo' scope, or fine-grained
#                       with 'Secrets: write'). Lets src/token_sync.py push
#                       the freshly-refreshed token.json back to
#                       SCHWAB_TOKEN_B64 after every run, so the daily cron
#                       itself keeps the refresh token alive indefinitely --
#                       no more manual re-auth every week.
#   NOTIFY_WEBHOOK_URL  A Slack or Discord incoming-webhook URL. If a symbol
#                       fails (not just the expected "no live quotes" skip),
#                       src/notify.py posts a one-line alert there.

on:
  schedule:
    # 21:30 UTC, Mon-Fri -- after the US market close (20:00-21:00 UTC
    # depending on DST) with a buffer for quotes to settle.
    - cron: "30 21 * * 1-5"
  workflow_dispatch: {} # allows manually triggering a run from the Actions tab

permissions:
  contents: write # needed to commit history/vol_history.db back to the repo

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore token.json from secret
        env:
          SCHWAB_TOKEN_B64: ${{ secrets.SCHWAB_TOKEN_B64 }}
        run: |
          python -c "
          import os
          from src.auth import write_token_from_base64
          write_token_from_base64(os.environ['SCHWAB_TOKEN_B64'])
          "

      - name: Run daily snapshot
        env:
          SCHWAB_API_KEY: ${{ secrets.SCHWAB_API_KEY }}
          SCHWAB_APP_SECRET: ${{ secrets.SCHWAB_APP_SECRET }}
          SCHWAB_CALLBACK_URL: ${{ secrets.SCHWAB_CALLBACK_URL }}
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
        run: python -m src.daily_snapshot

      # Runs even if the step above hit per-symbol failures -- schwab-py may
      # still have refreshed the token in place before a later symbol failed
      # for an unrelated reason, and that refreshed token is still worth
      # keeping. Only truly skips work if SECRETS_PAT isn't configured (see
      # src/token_sync.py).
      - name: Persist refreshed token back to SCHWAB_TOKEN_B64
        if: always()
        env:
          SECRETS_PAT: ${{ secrets.SECRETS_PAT }}
        run: python -m src.token_sync

      - name: Commit history if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history/vol_history.db database/schwab_database.db
          git diff --staged --quiet || git commit -m "Daily vol snapshot $(date -u +%F)"
          git push

      # Fallback alert for failures src/daily_snapshot.py's own notify() call
      # never got a chance to send -- e.g. "Restore token.json from secret"
      # or "Install dependencies" failing before the Python pipeline even runs.
      - name: Notify on workflow-level failure
        if: failure()
        env:
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
        run: |
          if [ -n "$NOTIFY_WEBHOOK_URL" ]; then
            curl -sS -X POST -H 'Content-Type: application/json' \
              -d "{\"text\": \"Vol Dashboard: daily-snapshot workflow failed before/outside the per-symbol pipeline -- check the Actions run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\", \"content\": \"Vol Dashboard: daily-snapshot workflow failed before/outside the per-symbol pipeline -- check the Actions run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
              "$NOTIFY_WEBHOOK_URL"
          fi
