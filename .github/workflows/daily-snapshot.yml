name: Daily vol snapshot

# Fetches every symbol in src/symbols.py's SYMBOL_REGISTRY and appends the
# computed metrics to history/vol_history.db, then commits that file so
# history survives between runs. This is what makes IV Rank, trailing
# z-scores, and the day-over-day digest possible -- see
# src/history_store.py's docstring for why a committed SQLite file rather
# than a hosted database.
#
# The raw per-contract chains and daily closes
# (database/schwab_database.db, see src/schwab_database.py) are NOT
# committed. They are published as a release asset on the fixed tag
# `chain-latest` and downloaded at the start of every run, because the table
# is append-only and each session is appended to the previous state. See
# src/chain_release.py.
#
# Why it is not in git, with the figures, so the next reader sees the trend
# rather than one snapshot:
#   2026-08-14  crossed GitHub's 100MB per-file push limit; "Commit history"
#               began failing silently while fetch and token steps passed
#   2026-08-20  moved to Git LFS, which fixed that
#   2026-10-15  10GB included, 1.8GB used, 0GB metered    (read as comfort)
#   2026-11-19  10GB included, 9.01GB used (90%)          (one run of room)
#   2026-11-22  moved to a release asset; LFS usage frozen
#
# What the optimistic readings missed: LFS cannot delta-compress a SQLite
# file, so every push stored a COMPLETE NEW COPY. At 658MB a copy and 58
# commits touching this file, the quota reached 9GB without the daily growth
# rate (12.2MB/session) ever changing. Storage is a stock, not a flow -- it
# does not reset on the 1st, and deleting branches or rewriting history does
# not reclaim it. With a $0 LFS budget the overage is refused rather than
# billed, so the wall at 10GB was `git push` being REJECTED here: data
# collected, then unsavable.
#
# Release assets are not metered against that quota. The next ceiling is 2GB
# PER ASSET, which at 12.2MB/session is roughly 114 sessions -- about 5.4
# months from 2026-11-22. That is when a retention window stops being
# optional. Check github.com/settings/billing/summary before acting on any
# figure here.
#
# history/vol_history.db IS still committed: 2.6MB of compact per-expiry
# metrics, an ordinary git object, and what every IV Rank and z-score reads.
#
# A live pull
# with no usable quotes (outside market hours) raises LiveDataUnavailableError
# and neither file gets touched that day -- see src/data_quality.py.
#
# Requires these repo secrets (Settings -> Secrets and variables -> Actions),
# same values as the Streamlit Cloud secrets -- see README.md:
#   SCHWAB_API_KEY, SCHWAB_APP_SECRET, SCHWAB_CALLBACK_URL, SCHWAB_TOKEN_B64
#
# Two more secrets fix the "refresh token dies after ~7 days" problem and add
# failure alerts -- both optional but strongly recommended (see README.md):
#   SECRETS_PAT        A GitHub PAT with permission to manage this repo's
#                       Actions secrets (classic 'repo' scope, or fine-grained
#                       with 'Secrets: write'). Lets src/token_sync.py push
#                       the freshly-refreshed token.json back to
#                       SCHWAB_TOKEN_B64 after every run, so the daily cron
#                       itself keeps the refresh token alive indefinitely --
#                       no more manual re-auth every week.
#   NOTIFY_WEBHOOK_URL  A Slack or Discord incoming-webhook URL. If a symbol
#                       fails (not just the expected "no live quotes" skip),
#                       src/notify.py posts a one-line alert there.

on:
  schedule:
    # 21:30 UTC, Mon-Fri -- after the US market close (20:00-21:00 UTC
    # depending on DST) with a buffer for quotes to settle.
    - cron: "30 21 * * 1-5"
  workflow_dispatch: {} # allows manually triggering a run from the Actions tab

permissions:
  contents: write # needed to commit history/vol_history.db back to the repo
  issues: write # needed by "Open an issue on failure" below

concurrency:
  # Two runs racing -- a manual re-run started while the cron fires, most
  # likely -- would both download the asset, both append their own session
  # to it, and both upload. The loser's session is then silently gone, and
  # a collision mid-upload can leave the tag with no asset at all, which
  # breaks the NEXT run's download. publish-demo.yml has this for the same
  # reason. Never cancel-in-progress: the run already holding the lock may
  # be mid-collection, and that session cannot be refetched.
  group: daily-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    # Pinned rather than ubuntu-latest. That label migrates to Ubuntu 26 on
    # 2026-10-19, and this job collects market data that cannot be refetched:
    # Schwab serves current chains only, so a session missed to a surprise
    # image change is a permanent hole in the history, not a rerun away. The
    # tests workflow deliberately stays on ubuntu-latest so the new image is
    # still exercised somewhere -- it just fails somewhere harmless first.
    runs-on: ubuntu-24.04
    steps:
      # No lfs: true, and nothing in this repo is LFS-tracked any more. The
      # chain database arrives from its release asset two steps below.
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore token.json from secret
        env:
          SCHWAB_TOKEN_B64: ${{ secrets.SCHWAB_TOKEN_B64 }}
        run: |
          python -c "
          import os
          from src.auth import write_token_from_base64
          write_token_from_base64(os.environ['SCHWAB_TOKEN_B64'])
          "

      # The chain table is append-only: today's session is appended to the
      # database the previous run produced, so that state has to be on disk
      # before collection starts. It arrives as a release asset rather than
      # in the checkout -- see the header.
      #
      # Failing loudly when it is missing is the point. Carrying on from an
      # empty database is the one outcome that destroys history: the job
      # would collect one session, publish that as the entire chain, and
      # replace four months Schwab will not serve again. src/chain_release.py
      # refuses a payload that is not plainly the database and refuses to
      # overwrite a local copy with a smaller one.
      #
      # CHAIN_ROWS_BEFORE is the baseline the publish step compares against.
      # If this step does not complete, that variable is unset and the
      # publish refuses outright rather than guessing.
      - name: Download the chain database
        run: |
          set -euo pipefail
          python -m src.chain_release download database/schwab_database.db
          ROWS=$(python -c 'from src.chain_release import row_count; print(row_count("database/schwab_database.db"))')
          echo "CHAIN_ROWS_BEFORE=$ROWS" >> "$GITHUB_ENV"
          echo "baseline: $ROWS contract rows"

      - name: Run daily snapshot
        env:
          SCHWAB_API_KEY: ${{ secrets.SCHWAB_API_KEY }}
          SCHWAB_APP_SECRET: ${{ secrets.SCHWAB_APP_SECRET }}
          SCHWAB_CALLBACK_URL: ${{ secrets.SCHWAB_CALLBACK_URL }}
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
        run: python -m src.daily_snapshot

      # if: always() and placed directly after collection, both deliberately.
      #
      # This step used to sit AFTER "Persist refreshed token" with no `if:`,
      # which meant a token-sync failure skipped it -- the day's chains were
      # collected into the runner's disk and then thrown away when the runner
      # was destroyed. That is what happened on 2026-11-18 and 2026-11-19:
      # twelve consecutive runs died on the token step, and because collection
      # itself had succeeded every time, those sessions were discarded rather
      # than missed. Schwab serves current chains only, so they are gone for
      # good.
      #
      # Nothing downstream of collection can make already-collected data less
      # worth keeping, so nothing downstream of collection gets to block the
      # commit. The same rule governs "Publish the chain database" below,
      # which saves the other half of the day's work. A partial day is still better than no day -- "Validate what
      # was collected" below exists to flag it, and the `git diff --staged
      # --quiet ||` guard means a run that collected nothing commits nothing.
      - name: Commit history if it changed
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history/vol_history.db
          git diff --staged --quiet || git commit -m "Daily vol snapshot $(date -u +%F)"
          git push

      # if: always(), for exactly the reason the commit above is. This is the
      # step that saves the day's chains; nothing downstream of collection
      # gets to block it.
      #
      # Three outcomes, kept distinct on purpose:
      #   fewer rows than were downloaded -> REFUSE. The chain table only
      #     ever grows, so fewer means the database was reset or truncated
      #     somewhere in this run, and uploading it would overwrite every
      #     session with the wreckage.
      #   the same number -> nothing was collected. A run outside market
      #     hours raises LiveDataUnavailableError and writes nothing (see
      #     src/data_quality.py), so leave the asset alone. A no-op, not an
      #     error.
      #   more -> publish.
      #
      # No baseline means no decision can be made safely, so that refuses
      # too: if the download step did not finish, the file on disk may be a
      # fresh database holding only today's session.
      #
      # --clobber replaces the asset in place, which keeps the download URL
      # identical. Deleting and re-creating the release would briefly leave
      # it 404ing and the next run curls that exact URL for its starting
      # state -- the same reasoning recorded in publish-demo.yml.
      - name: Publish the chain database
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: chain-latest
        run: |
          set -euo pipefail
          if [ -z "${CHAIN_ROWS_BEFORE:-}" ]; then
            echo "No baseline: the download step did not complete, so the database on disk"
            echo "cannot be compared against what this run started from. Refusing to publish."
            exit 1
          fi
          python -m src.chain_release verify database/schwab_database.db --min-rows "$CHAIN_ROWS_BEFORE"
          AFTER=$(python -c 'from src.chain_release import row_count; print(row_count("database/schwab_database.db"))')
          if [ "$AFTER" -eq "$CHAIN_ROWS_BEFORE" ]; then
            echo "Still $AFTER contract rows -- nothing collected this run. Leaving $TAG untouched."
            exit 0
          fi
          echo "Publishing: $CHAIN_ROWS_BEFORE -> $AFTER contract rows"
          gh release upload "$TAG" database/schwab_database.db --clobber
          NEWEST=$(python -c "import sqlite3;print(sqlite3.connect('file:database/schwab_database.db?mode=ro',uri=True).execute('SELECT MAX(snapshot_date) FROM options').fetchone()[0])")
          gh release edit "$TAG" --notes "Raw per-contract options chains and daily closes collected by .github/workflows/daily-snapshot.yml — through session $NEWEST, $AFTER contract rows, updated $(date -u +%Y-%m-%dT%H:%MZ).

          Replaced in place after every collection, so this download URL is stable:

              https://github.com/${{ github.repository }}/releases/download/$TAG/schwab_database.db

          Not committed to the repository: Git LFS stores a complete new copy per push, which took the quota to 9.01GB of an included 10GB while the daily growth rate never changed. Release assets are not metered against that quota."
          echo "published session $NEWEST"

      # Placed after the commit AND the publish deliberately: a validation
      # failure should flag the problem, never discard or withhold the day's
      # data. It runs here rather than in data-validation.yml because this
      # job has the real chain database on disk -- that job deliberately does
      # not download it, so its raw-chain cross-check reports itself SKIPPED
      # and runs here instead.
      # --run-created-at carries when the run was CREATED, not when it is
      # executing. For a first attempt those are the same moment; for a
      # re-run they are not, and the difference is the whole check.
      #
      # On 2026-10-30 the Thursday collection failed at 01:11 UTC and was
      # re-run at 17:58. By then the live session had moved on, so it
      # collected Friday, reported success, and left a permanent hole where
      # Thursday should be. Schwab serves current quotes only, so a late
      # re-run cannot recover the day it was meant to cover. Nothing said
      # so: GitHub reports the latest attempt's conclusion, so the Actions
      # list showed a green check over a missing day.
      - name: Validate what was collected
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CREATED=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)
          echo "run $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT, created $CREATED"
          python -m src.validate_collection --max-stale-days 3 --run-created-at "$CREATED"

      # Runs even if the steps above failed -- schwab-py may still have
      # refreshed the token in place before a later symbol failed for an
      # unrelated reason, and that refreshed token is still worth keeping.
      # Only truly skips work if SECRETS_PAT isn't configured (see
      # src/token_sync.py).
      #
      # Deliberately LAST. The token on disk is written during collection and
      # nothing after it touches token.json, so this step's position cannot
      # affect which token gets persisted -- but when it ran second it could,
      # and did, stop the commit below it from happening at all. A step that
      # saves a credential for *tomorrow* must never outrank saving the data
      # from *today*, because tomorrow's run can re-auth and today's session
      # cannot be refetched.
      - name: Persist refreshed token back to SCHWAB_TOKEN_B64
        if: always()
        env:
          SECRETS_PAT: ${{ secrets.SECRETS_PAT }}
        run: python -m src.token_sync

      # Replaces a webhook POST guarded by `if [ -n "$NOTIFY_WEBHOOK_URL" ]`.
      # NOTIFY_WEBHOOK_URL was never configured, so that step did nothing and
      # exited 0 -- a green check on a step whose entire job was to raise the
      # alarm. Twelve failed runs went unnoticed behind it.
      #
      # An issue needs no secret: github.token is injected automatically, so
      # this cannot silently deactivate the way the webhook did. GitHub emails
      # the repo owner on a new issue, and the open issue itself is a standing
      # marker that the pipeline is down -- visible without opening the
      # Actions tab.
      #
      # Comments on the existing open issue rather than filing a new one each
      # night, so a week-long outage reads as one thread with seven entries
      # instead of seven issues.
      - name: Open an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Daily snapshot pipeline is failing
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          BODY=$(cat <<EOF
          Run \`$GITHUB_RUN_ID\` (attempt $GITHUB_RUN_ATTEMPT) failed on $(date -u +%F).

          The failing step is named in the run log: $RUN_URL

          **This is time-sensitive.** Schwab serves current chains only, so a
          re-run tomorrow collects tomorrow -- it cannot recover the session
          this run was scheduled for. Every night this stays broken is a
          permanent hole in \`history/vol_history.db\`.

          Check which step failed before assuming the Schwab token is at
          fault; see \`.claude/skills/vol-dashboard-development/references/known-issues.md\`.
          EOF
          )
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"
          fi
