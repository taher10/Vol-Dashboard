[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q --strict-markers

# Put the repo root on sys.path so `from src...` resolves. Without this,
# bare `pytest` fails collection with ModuleNotFoundError: No module named
# 'src' while `python -m pytest` passes, because the -m form implicitly adds
# the working directory and the bare entry point does not. That divergence
# is easy to ship by accident: the suite looked green locally and broke in
# CI, which runs the bare form. Setting it here makes both invocations work.
pythonpath = .

# schwab-py pulls in websockets, whose legacy module warns on import. It's a
# transitive dependency's deprecation, not anything this project can act on,
# and leaving it visible trains people to ignore warning output.
filterwarnings =
    ignore:websockets.legacy is deprecated:DeprecationWarning
